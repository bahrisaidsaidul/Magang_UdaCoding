<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="shortcut icon" href="css/img/notes.png" type="image/x-icon">
</head>

<body>
    <div class="container">
        <!-- Header dengan Cuaca -->
        <header>
            <h1>Todo List Jakarta</h1>
        </header>

        <!-- Form Tambah Todo -->
        <div class="todo-form">
            <input type="text" id="todoInput" placeholder="Tambahkan tugas baru" autocomplete="off">
            <button id="addButton" class="btn-add">
                <i class="fas fa-plus"></i> Tambah
            </button>
        </div>

        <!-- Filter Controls -->
        <div class="filter-controls">
            <button class="filter-btn active" data-filter="all">Semua</button>
            <button class="filter-btn" data-filter="active">Aktif</button>
            <button class="filter-btn" data-filter="completed">Selesai</button>
        </div>

        <!-- Todo List -->
        <div class="todo-list-container" id="todoListContainer">
            <ul class="todo-list" id="todoList"></ul>
        </div>

        <!-- Footer Info -->
        <div class="todo-stats">
            <span id="todoCount">0 tugas tersisa</span>
            <button id="clearCompleted" class="btn-clear">Hapus yang selesai</button>
        </div>
    </div>

    <!-- Dialog Edit -->
    <div class="edit-dialog" id="editDialog">
        <div class="edit-dialog-content">
            <h3>Edit Tugas</h3>
            <input type="text" id="editInput" placeholder="Ubah tugas...">
            <div class="edit-dialog-buttons">
                <button id="saveEdit" class="btn-save">Simpan</button>
                <button id="cancelEdit" class="btn-cancel">Batal</button>
            </div>
        </div>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/todoManager.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
